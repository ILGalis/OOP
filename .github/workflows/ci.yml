name: Java CI with Gradle

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          gradle-home-path: Task_1_1_1

      - name: Grant execute permission for gradlew
        run: |
          LAB_FOLDER="${{ github.event.pull_request.title }}"
          if [ -z "$LAB_FOLDER" ]; then
            LAB_FOLDER="Task_1_1_1"
          fi
          chmod +x "$LAB_FOLDER/gradlew"

      - name: Build with Gradle
        run: |
          LAB_FOLDER="${{ github.event.pull_request.title }}"
          if [ -z "$LAB_FOLDER" ]; then
            echo "❌ Не удалось определить папку (не Pull Request)"
            echo "ℹ️  Используем папку по умолчанию: Task_1_1_1"
            LAB_FOLDER="Task_1_1_1"
          fi
          echo "📁 Сборка лабораторной: $LAB_FOLDER"
          if [ ! -d "$LAB_FOLDER" ]; then
            echo "❌ Папка $LAB_FOLDER не найдена!"
            exit 1
          fi
          cd "$LAB_FOLDER"
          ./gradlew build test jacocoTestReport

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: ${{ github.event.pull_request.title }}/build/reports/jacoco/test/html/

      - name: Deploy Javadoc to GitHub Pages
        uses: dev-vince/actions-publish-javadoc@v1.0.1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          project: gradle
          branch: gh-pages
          path: ${{ github.event.pull_request.title }}/build/docs/javadoc/